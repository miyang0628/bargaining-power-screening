# ============================================================
# PRE-REGISTERED CONFIGURATION
# Frozen before data inspection. Generation rules are fixed
# independently of the screening procedure (generation-validation split).
# ============================================================

seeds:
  structure: 1001   # market structure / power-law sizes
  beta:      2002   # latent true bargaining power beta*
  noise:     3003   # observation noise on proxies
  asset:     4004   # asset specificity s (independent of beta*)
  behavior:  5005   # behavioral outcome variables (criterion validity)
  n_replications: 100

# --- g(): latent true bargaining power ---
g_function:
  theta_size: 1.2
  theta_irr:  1.5    # irreplaceability weighted highest (theory: substitutability > size)
  theta_conc: 0.6
  sigma_beta: 0.4
  irr_beta_params:    # per-domain Beta(alpha, beta) for irreplaceability
    E: [2, 3]         # mean ~0.40
    S: [5, 2]         # mean ~0.71  (non-substitutable domain)
    G: [2, 5]         # mean ~0.29

# --- market structure scenarios ---
scenarios:
  oligopolistic:
    N:      {E: 8,  S: 6,  G: 20}
    alpha:  {E: 1.4, S: 1.2, G: 2.2}   # power-law exponent (smaller = more concentrated)
  fragmented:
    N:      {E: 40, S: 35, G: 60}
    alpha:  {E: 2.6, S: 2.4, G: 3.0}
  intermediate:
    N:      {E: 20, S: 16, G: 38}
    alpha:  {E: 2.0, S: 1.8, G: 2.6}

# --- observation-noise reliability profile (domain judgement) ---
# reliability rho_x in (0,1): how easily proxy x is observed.
# sigma_x is back-solved from rho_x: sigma^2 = Var(logit beta*) * (1-rho)/rho
reliability:
  reach:       0.55
  share:       0.50
  switch_cost: 0.35   # hardest to observe -> lowest reliability
  concentration: 0.45
noise_common_ratio: 0.30   # w_c: shared vs idiosyncratic noise

# --- b: latent bargaining-power index (proxy weights) ---
b_weights:
  reach:       0.45
  share:       0.25
  switch_cost: 0.15
  concentration: 0.15

# --- risk function R(b; s, c) = (1+s+c)*R_d(b) + R_e(b) ---
risk:
  # R_d: dependence-reversal (increasing, convex);  R_e: exploitation/exit (decreasing, convex)
  rd_power: 2.0
  re_power: 2.0

# --- screening rule ---
screening:
  throughput_quantile: 0.50   # keep top half by throughput
  risk_lower_fraction: 0.40   # keep lowest 40% total risk (avoid both extremes)

# --- validation targets (pre-registered) ---
validation:
  target_corr_beta_low:  0.70
  target_corr_beta_high: 0.85
  primary_discrimination: AUC

# --- extreme case ---
extreme_case:
  domain: S
  beta_floor: 0.80   # super-supplier planted with high beta*
